name: Watermark and Publish Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job identifier"
        required: true
      media_type:
        description: "video or image"
        required: true
        default: "video"
      size_ratio:
        description: "Size Ratio"
        required: true
        default: "0.20"
      opacity:
        description: "Opacity"
        required: true
        default: "0.85"
      x_ratio:
        description: "X Ratio"
        required: true
        default: "0.85"
      y_ratio:
        description: "Y Ratio"
        required: true
        default: "0.85"
      caption:
        description: "Telegram Caption"
        required: false
        default: ""
      bot_token:
        description: "Telegram Bot Token"
        required: true
      chat_id:
        description: "Target Chat or Channel ID"
        required: true

jobs:
  process-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install FFmpeg & Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl jq

      - name: Fetch and Decode Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB: ${{ github.event.inputs.job_id }}
        run: |
          mkdir -p workspace
          
          # دریافت محتوای Base64 مستقیم از API و دیکود به فایل باینری
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/input_media" \
               | jq -r '.content' | tr -d '\n\r ' | base64 --decode > workspace/input_media

          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/watermark.png" \
               | jq -r '.content' | tr -d '\n\r ' | base64 --decode > workspace/watermark.png

          echo "=== بررسی حجم فایل‌های دانلود شده ==="
          ls -lh workspace/

          # اگر فایل ورودی خالی بود اکشن را متوقف کن
          if [ ! -s workspace/input_media ]; then
            echo "خطا: فایل ورودی خالی است!"
            exit 1
          fi

      - name: Apply Watermark with FFmpeg
        run: |
          SIZE="${{ github.event.inputs.size_ratio }}"
          OPACITY="${{ github.event.inputs.opacity }}"
          X_POS="${{ github.event.inputs.x_ratio }}"
          Y_POS="${{ github.event.inputs.y_ratio }}"
          
          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            ffmpeg -y -i workspace/input_media -i workspace/watermark.png -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            -codec:a copy -preset ultrafast workspace/output.mp4
          else
            ffmpeg -y -i workspace/input_media -i workspace/watermark.png -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            workspace/output.jpg
          fi

          echo "=== فایل نهایی پردازش شده ==="
          ls -lh workspace/output.*

      - name: Send Direct to Telegram
        env:
          TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT: ${{ github.event.inputs.chat_id }}
          CAP: ${{ github.event.inputs.caption }}
          TYPE: ${{ github.event.inputs.media_type }}
        run: |
          echo "ارسال به مقصد: $CHAT"
          
          if [ "$TYPE" = "video" ]; then
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendVideo" \
                 -F "chat_id=${CHAT}" \
                 -F "video=@workspace/output.mp4" \
                 -F "caption=${CAP}")
          else
            RESP=$(curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendPhoto" \
                 -F "chat_id=${CHAT}" \
                 -F "photo=@workspace/output.jpg" \
                 -F "caption=${CAP}")
          fi

          echo "پاسخ سرور تلگرام: $RESP"
          OK=$(echo "$RESP" | jq -r '.ok')
          if [ "$OK" != "true" ]; then
            echo "خطا در ارسال به تلگرام!"
            exit 1
          fi

      - name: Cleanup Temp Files
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB: ${{ github.event.inputs.job_id }}
        run: |
          M_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/input_media" | jq -r '.sha')
          W_SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/watermark.png" | jq -r '.sha')
          
          [ "$M_SHA" != "null" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -d "{\"message\":\"cleanup\",\"sha\":\"$M_SHA\"}" "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/input_media"
          [ "$W_SHA" != "null" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -d "{\"message\":\"cleanup\",\"sha\":\"$W_SHA\"}" "https://api.github.com/repos/$REPO/contents/temp_jobs/$JOB/watermark.png"
