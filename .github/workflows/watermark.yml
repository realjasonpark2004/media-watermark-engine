name: Watermark and Publish Engine

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag containing uploaded media"
        required: true
      media_type:
        description: "video or image"
        required: true
        default: "video"
      size_ratio:
        description: "Size Ratio"
        required: true
        default: "0.20"
      opacity:
        description: "Opacity"
        required: true
        default: "0.85"
      x_ratio:
        description: "X Ratio"
        required: true
        default: "0.85"
      y_ratio:
        description: "Y Ratio"
        required: true
        default: "0.85"
      caption:
        description: "Telegram Caption"
        required: false
        default: ""
      bot_token:
        description: "Telegram Bot Token"
        required: true
      chat_id:
        description: "Target Chat or Channel ID"
        required: true

jobs:
  process-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl jq

      - name: Download Uploaded Assets from Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          # دریافت لینک دانلود فایل‌ها از Release موقت
          REL_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          
          MEDIA_URL=$(echo "$REL_JSON" | jq -r '.assets[] | select(.name=="input_media") | .browser_download_url')
          WM_URL=$(echo "$REL_JSON" | jq -r '.assets[] | select(.name=="watermark.png") | .browser_download_url')
          
          curl -sL -o input_media "$MEDIA_URL"
          curl -sL -o watermark.png "$WM_URL"

      - name: Apply Watermark with FFmpeg
        run: |
          SIZE="${{ github.event.inputs.size_ratio }}"
          OPACITY="${{ github.event.inputs.opacity }}"
          X_POS="${{ github.event.inputs.x_ratio }}"
          Y_POS="${{ github.event.inputs.y_ratio }}"
          
          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            ffmpeg -y -i input_media -i watermark.png -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            -codec:a copy -preset ultrafast output.mp4
          else
            ffmpeg -y -i input_media -i watermark.png -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            output.jpg
          fi

      - name: Send Direct to Telegram
        env:
          TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT: ${{ github.event.inputs.chat_id }}
          CAP: ${{ github.event.inputs.caption }}
        run: |
          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            curl -F chat_id="$CHAT" \
                 -F video=@output.mp4 \
                 -F caption="$CAP" \
                 "https://api.telegram.org/bot$TOKEN/sendVideo"
          else
            curl -F chat_id="$CHAT" \
                 -F photo=@output.jpg \
                 -F caption="$CAP" \
                 "https://api.telegram.org/bot$TOKEN/sendPhoto"
          fi

      - name: Cleanup Temporary Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          REL_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG" | jq -r '.id')
          if [ "$REL_ID" != "null" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/$REL_ID"
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/git/refs/tags/$TAG"
          fi
