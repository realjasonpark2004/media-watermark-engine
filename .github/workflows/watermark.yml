name: Watermark and Publish Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job identifier"
        required: true
      media_type:
        description: "video or image"
        required: true
        default: "image"
      size_ratio:
        description: "Size Ratio"
        required: true
        default: "0.20"
      opacity:
        description: "Opacity"
        required: true
        default: "0.85"
      x_ratio:
        description: "X Ratio"
        required: true
        default: "0.85"
      y_ratio:
        description: "Y Ratio"
        required: true
        default: "0.85"
      caption:
        description: "Telegram Caption"
        required: false
        default: ""
      bot_token:
        description: "Telegram Bot Token"
        required: true
      chat_id:
        description: "Target Chat or Channel ID"
        required: true

jobs:
  process-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install FFmpeg & Tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl jq

      - name: Prepare Input Media
        run: |
          JOB_PATH="temp_jobs/${{ github.event.inputs.job_id }}"
          echo "Checking directory: $JOB_PATH"
          ls -la "$JOB_PATH"

          cp "$JOB_PATH/input_media" ./input_file
          cp "$JOB_PATH/watermark.png" ./watermark_file.png

      - name: Apply Watermark
        run: |
          SIZE="${{ github.event.inputs.size_ratio }}"
          OPACITY="${{ github.event.inputs.opacity }}"
          X_POS="${{ github.event.inputs.x_ratio }}"
          Y_POS="${{ github.event.inputs.y_ratio }}"
          
          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            ffmpeg -y -i ./input_file -i ./watermark_file.png -filter_complex \
            "[0:v][1:v]scale2ref=w=iw*${SIZE}:h=-1[main][wm]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [main][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            -c:a copy ./output_media.mp4
          else
            ffmpeg -y -i ./input_file -i ./watermark_file.png -filter_complex \
            "[0:v][1:v]scale2ref=w=iw*${SIZE}:h=-1[main][wm]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [main][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            ./output_media.jpg
          fi

          echo "Verifying processed file:"
          ls -lh ./output_media.*

      - name: Send to Telegram
        env:
          BOT_TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          CAPTION: ${{ github.event.inputs.caption }}
          MEDIA_TYPE: ${{ github.event.inputs.media_type }}
        run: |
          echo "Sending to Telegram Destination: $CHAT_ID"
          
          if [ "$MEDIA_TYPE" = "video" ]; then
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendVideo" \
                 -F "chat_id=${CHAT_ID}" \
                 -F "video=@output_media.mp4" \
                 -F "caption=${CAPTION}")
          else
            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto" \
                 -F "chat_id=${CHAT_ID}" \
                 -F "photo=@output_media.jpg" \
                 -F "caption=${CAPTION}")
          fi

          echo "Response: $RESPONSE"
          IS_OK=$(echo "$RESPONSE" | jq -r '.ok')
          if [ "$IS_OK" != "true" ]; then
            echo "Telegram Delivery Failed!"
            exit 1
          fi

      - name: Cleanup Temp Job Files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git rm -r -f "temp_jobs/${{ github.event.inputs.job_id }}" || true
          git commit -m "cleanup temp job ${{ github.event.inputs.job_id }}" || true
          git push origin main || true
