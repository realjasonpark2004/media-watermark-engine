name: Watermark and Publish Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job identifier folder"
        required: true
      media_type:
        description: "video or image"
        required: true
        default: "video"
      size_ratio:
        description: "Size Ratio"
        required: true
        default: "0.20"
      opacity:
        description: "Opacity"
        required: true
        default: "0.85"
      x_ratio:
        description: "X Ratio"
        required: true
        default: "0.85"
      y_ratio:
        description: "Y Ratio"
        required: true
        default: "0.85"
      caption:
        description: "Telegram Caption"
        required: false
        default: ""
      bot_token:
        description: "Telegram Bot Token"
        required: true
      chat_id:
        description: "Target Chat or Channel ID"
        required: true

jobs:
  process-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Latest Commits
        run: |
          git pull origin main

      - name: Install FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg curl jq

      - name: Apply Watermark with FFmpeg
        run: |
          JOB_DIR="temp_jobs/${{ github.event.inputs.job_id }}"
          SIZE="${{ github.event.inputs.size_ratio }}"
          OPACITY="${{ github.event.inputs.opacity }}"
          X_POS="${{ github.event.inputs.x_ratio }}"
          Y_POS="${{ github.event.inputs.y_ratio }}"
          
          echo "Processing files from: $JOB_DIR"
          ls -la "$JOB_DIR"

          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            ffmpeg -y -i "$JOB_DIR/input_media" -i "$JOB_DIR/watermark.png" -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            -codec:a copy -preset ultrafast output.mp4
          else
            ffmpeg -y -i "$JOB_DIR/input_media" -i "$JOB_DIR/watermark.png" -filter_complex \
            "[1:v][0:v]scale2ref=w='if(gt(main_w,main_h),main_w*${SIZE},-1)':h='if(gt(main_w,main_h),-1,main_h*${SIZE})'[wm][base]; \
             [wm]format=rgba,colorchannelmixer=aa=${OPACITY}[wm_alpha]; \
             [base][wm_alpha]overlay=W*${X_POS}-w/2:H*${Y_POS}-h/2" \
            output.jpg
          fi

          echo "Check output files:"
          ls -lh output.*

      - name: Send Direct to Telegram
        env:
          TOKEN: ${{ github.event.inputs.bot_token }}
          CHAT: ${{ github.event.inputs.chat_id }}
          CAP: ${{ github.event.inputs.caption }}
        run: |
          echo "Sending to Telegram Chat: $CHAT"
          if [ "${{ github.event.inputs.media_type }}" = "video" ]; then
            RESP=$(curl -s -F chat_id="$CHAT" -F video=@output.mp4 -F caption="$CAP" "https://api.telegram.org/bot$TOKEN/sendVideo")
          else
            RESP=$(curl -s -F chat_id="$CHAT" -F photo=@output.jpg -F caption="$CAP" "https://api.telegram.org/bot$TOKEN/sendPhoto")
          fi
          
          echo "Response from Telegram: $RESP"
          IS_OK=$(echo "$RESP" | jq -r '.ok')
          if [ "$IS_OK" != "true" ]; then
            echo "Error from Telegram API!"
            exit 1
          fi

      - name: Cleanup Temp Job Files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          git rm -r -f "temp_jobs/${{ github.event.inputs.job_id }}" || true
          git commit -m "cleanup: job ${{ github.event.inputs.job_id }}" || true
          git push origin main || true
